<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121313" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ось — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --ink:#1D1E20; --ink2:#4A4B4E; --muted:#87888B; --line:#E3E2DD; --line-strong:#C9C8C2;
  --accent:#004225; --accent-soft:#E4EDE8; --on-accent:#FFFFFF; --warn:#9B3D2F;
  --a0:#E8E5DE; --a1:#DCE5DF; --a2:#E2E1E8; --a3:#EAE1D8;
  --ease:cubic-bezier(.32,.72,0,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121313; --surface:#1A1B1C; --ink:#ECEBE6; --ink2:#BDBCB7; --muted:#8E8F92; --line:#28292B; --line-strong:#3A3B3E;
    --accent:#3E8C66; --accent-soft:#17251E; --on-accent:#FFFFFF; --warn:#D07A6A;
    --a0:#2A2926; --a1:#1F2A24; --a2:#26252C; --a3:#2C2621; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121313; --surface:#1A1B1C; --ink:#ECEBE6; --ink2:#BDBCB7; --muted:#8E8F92; --line:#28292B; --line-strong:#3A3B3E;
  --accent:#3E8C66; --accent-soft:#17251E; --on-accent:#FFFFFF; --warn:#D07A6A;
  --a0:#2A2926; --a1:#1F2A24; --a2:#26252C; --a3:#2C2621; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#stage{position:absolute;inset:0 0 64px 0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);
  padding:20px 22px 44px;-webkit-overflow-scrolling:touch;
  transition:transform .44s var(--ease),opacity .3s ease;will-change:transform}
.screen.pushed{box-shadow:-1px 0 0 var(--line)}
.screen.off-right{transform:translateX(100%)}
.screen.behind{transform:translateX(-24%);opacity:.5}
.screen.fade-start{opacity:0;transform:translateY(6px)}
.screen.fade-out{opacity:0;transition-duration:.2s}
.screen.dragging{transition:none}

/* типографика */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 18px}
.date{color:var(--muted);font-size:14px;margin-bottom:4px}
h1{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:-.005em;margin-bottom:10px}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:20px;height:20px}
.demo-note{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:16px;margin:2px 0 16px -6px;padding:6px}
.back svg{width:22px;height:22px}
.block{margin-bottom:34px}
.row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.row-head h2{margin:0}
.count{font-size:14px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;width:0;transition:width .7s var(--ease)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}

/* кольца */
.ring{display:block;flex:none}
.ring .rt{fill:none;stroke:var(--line)}
.ring .ra{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.ringbox{position:relative;display:inline-grid;place-items:center;flex:none}
.ringbox>span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600}

/* сводка ассистента */
.brief{margin-bottom:26px}
.brief-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--accent);margin-bottom:10px}
.brief-head i{width:8px;height:8px;border-radius:4px;background:var(--accent)}
.brief-row{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:7px 0;font-size:15px;line-height:1.4}
.brief-row span{color:var(--muted);font-size:14px}

/* день */
.dayhead{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.dayhead b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.dayhead span{font-size:14px;color:var(--muted)}

/* задачи */
.list{display:flex;flex-direction:column}
.task{display:flex;gap:14px;align-items:flex-start;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.list .task:last-child{border-bottom:0}
.check{flex:none;width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line-strong);display:grid;place-items:center;margin-top:1px;
  transition:background .28s var(--ease),border-color .28s var(--ease),transform .28s var(--ease)}
.check svg{width:14px;height:14px;fill:none;stroke:var(--on-accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s var(--ease) .06s}
.task:active .check{transform:scale(.88)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{stroke-dashoffset:0}
.t-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-title{font-size:16px;text-decoration:line-through;text-decoration-color:transparent;transition:color .3s ease,text-decoration-color .3s ease}
.task.done .t-title{color:var(--muted);text-decoration-color:var(--muted)}
.t-meta{font-size:13px;color:var(--muted)}

/* график недели */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.wk-track{width:100%;max-width:30px;background:var(--line);border-radius:8px;position:relative;overflow:hidden;height:0;transition:height .7s var(--ease)}
.wk-fill{position:absolute;left:0;right:0;bottom:0;background:var(--ink2);border-radius:8px;height:0;transition:height .6s var(--ease)}
.wk.is-today .wk-fill{background:var(--accent)}
.wk-l{font-size:13px;color:var(--muted)}
.wk.is-today .wk-l{color:var(--accent);font-weight:600}
.wk-n{font-size:12px;color:var(--muted);min-height:16px}

/* шаги к целям */
.step{display:flex;justify-content:space-between;gap:16px;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step b{display:block;font-weight:500;font-size:16px}
.step span{font-size:14px;color:var(--muted)}
.pill{flex:none;font-size:14px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.warn{color:var(--warn);background:transparent;border:1px solid var(--line)}

/* проекты */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 26px}
.stats>div{border-top:1px solid var(--line);padding-top:10px}
.stats b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.stats span{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.proj{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.p-name{font-size:17px;font-weight:500;line-height:1.3}
.p-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin-top:3px}
.p-meta .soon{color:var(--warn)}
.avs{display:flex;margin-top:8px}
.av{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:11px;letter-spacing:-.02em;font-weight:600;color:var(--ink2);border:2px solid var(--bg);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.av.a0{background:var(--a0)}.av.a1{background:var(--a1)}.av.a2{background:var(--a2)}.av.a3{background:var(--a3)}
.av.lg{width:40px;height:40px;border-radius:20px;font-size:14px;border:0;margin:0}
.hero{display:flex;align-items:center;gap:20px;margin:20px 0 24px}
.hero p{font-size:15px;color:var(--ink2);line-height:1.45}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 30px}
.facts>div{border-top:1px solid var(--line);padding-top:10px}
.facts span{display:block;font-size:13px;color:var(--muted)}
.facts b{font-weight:500;font-size:17px}
.facts .bar{margin-top:8px}

/* этапы */
.stages{display:flex;gap:4px;margin-bottom:12px}
.stages i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stages i.done{background:var(--accent)}
.stages i.now{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.path{list-style:none;margin:0;padding:0}
.path li{position:relative;padding:0 0 22px 32px}
.path li:last-child{padding-bottom:0}
.path li::before{content:"";position:absolute;left:6px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.path li.done::before{background:var(--accent)}
.path li:last-child::before{display:none}
.path .pn{position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:7px;border:2px solid var(--line-strong);background:var(--bg)}
.path li.done .pn{background:var(--accent);border-color:var(--accent)}
.path li.now .pn{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.path b{display:block;font-weight:500;font-size:16px}
.path span{font-size:13px;color:var(--muted)}
.path li.now span{color:var(--accent)}

.person{display:flex;align-items:center;gap:14px;padding:10px 0}
.person b{display:block;font-weight:500;font-size:16px}
.person span{font-size:14px;color:var(--muted)}
.note{padding:14px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.note p{font-size:15px;line-height:1.5}
.group-day{font-size:14px;color:var(--muted);margin:16px 0 0}

/* цели */
.goal{display:block;width:100%;padding:20px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.g-name{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.g-now{font-size:14px;color:var(--muted)}
.spark{display:block;flex:none}
.spark polyline{fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.g-foot{display:flex;gap:18px;font-size:14px;color:var(--muted);margin-top:12px}
.g-foot b{color:var(--ink);font-weight:500}
.hist{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:140px;margin:6px 0 4px}
.h-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.h-plan{width:100%;max-width:26px;border:1.5px dashed var(--line-strong);border-radius:7px;position:relative;height:0;transition:height .7s var(--ease)}
.h-done{position:absolute;left:-1.5px;right:-1.5px;bottom:-1.5px;background:var(--ink2);border-radius:7px;height:0;transition:height .7s var(--ease) .1s}
.h-col.cur .h-done{background:var(--accent)}
.h-col span{font-size:11px;color:var(--muted)}
.h-col.cur span{color:var(--accent);font-weight:600}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.week-step span{font-size:13px;color:var(--muted)}
.week-step b{display:block;font-weight:500;font-size:17px;margin-top:2px}

/* учёба */
.next{display:flex;justify-content:space-between;align-items:center;gap:14px}
.next span{font-size:13px;color:var(--muted)}
.next b{display:block;font-size:17px;font-weight:500;margin:2px 0}
.next em{font-style:normal;font-size:14px;color:var(--ink2)}
.btn{flex:none;font-size:14px;font-weight:500;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:8px 14px}
.cls{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cls:last-child{border-bottom:0}
.cls .when{font-size:14px;color:var(--muted)}
.cls .when b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.cls.today .when b{color:var(--accent)}
.cls .what b{display:block;font-weight:500;font-size:16px}
.cls .what span{font-size:14px;color:var(--muted)}
.dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl b{font-weight:500;font-size:16px;line-height:1.35}
.dl small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.dl .bar{grid-column:1/-1}
.score{display:grid;grid-template-columns:1fr 38px;gap:4px 12px;align-items:center;width:100%;padding:9px 0}
.score b{font-weight:400;font-size:15px}
.score em{font-style:normal;font-size:15px;text-align:right}
.score .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.score .track i{display:block;height:100%;background:var(--ink2);border-radius:3px;width:0;transition:width .8s var(--ease)}
.score.best .track i{background:var(--accent)}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 1.1s var(--ease)}
.chart .pt{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}

/* финансы */
.money-big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:4px 0 6px;white-space:nowrap}
.delta{font-size:14px;color:var(--muted)}
.delta b{color:var(--accent);font-weight:500}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:end;height:170px;margin-top:8px}
.mo{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.mo-bars{display:flex;gap:5px;align-items:flex-end;height:calc(100% - 26px);width:100%;justify-content:center}
.mo-bars i{width:22px;border-radius:6px;height:0;transition:height .8s var(--ease)}
.mo-bars i.in{background:var(--accent)}
.mo-bars i.out{background:var(--ink2);opacity:.75}
.mo span{font-size:13px;color:var(--muted)}
.mo.cur span{color:var(--ink);font-weight:500}
.budget{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0}
.budget b{font-weight:400;font-size:15px}
.budget em{font-style:normal;font-size:14px;color:var(--muted)}
.budget em.full{color:var(--warn)}
.budget .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.budget .track i{display:block;height:100%;background:var(--ink2);border-radius:3px;width:0;transition:width .8s var(--ease)}
.budget .track i.full{background:var(--warn)}
.jars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jar{display:flex;flex-direction:column;gap:12px}
.jar>div>b{display:block;font-weight:500;font-size:15px}
.jar>div>span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.jar em{display:block;font-style:normal;font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:6px}
.op{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.op:last-child{border-bottom:0}
.op b{display:block;font-weight:400;font-size:16px}
.op span{font-size:13px;color:var(--muted)}
.op .sum{font-size:16px;white-space:nowrap}
.op .sum.in{color:var(--accent)}

.reset{display:block;margin:4px auto 0;color:var(--muted);font-size:14px;padding:8px 12px}
#toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);font-size:14px;
  padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s var(--ease);z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* меню */
#tabs{position:absolute;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:500;transition:color .25s ease;text-align:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-live="polite"></main>
  <div id="toast" role="status"></div>
  <nav id="tabs" aria-label="Разделы">
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Сегодня</button>
    <button class="tab" data-tab="projects"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 10h17M9 5v14"/></svg>Проекты</button>
    <button class="tab" data-tab="goals"><svg viewBox="0 0 24 24"><path d="M5 20V4.5M5 5h11l-2.2 3.5L16 12H5"/></svg>Цели</button>
    <button class="tab" data-tab="study"><svg viewBox="0 0 24 24"><path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4.5c1.5 1.4 3.2 2 5 2s3.5-.6 5-2V11"/></svg>Учёба</button>
    <button class="tab" data-tab="money"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="3"/><path d="M3.5 10h17M15.5 14.5h2"/></svg>Финансы</button>
  </nav>
</div>

<script>
(function(){
/* ================= даты: всё считается от сегодняшнего дня ================= */
const now=new Date();const today=new Date(now);today.setHours(0,0,0,0);
const ti=(today.getDay()+6)%7;
const monday=new Date(today);monday.setDate(today.getDate()-ti);
const dayDate=i=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d};
const plusDays=n=>{const d=new Date(today);d.setDate(today.getDate()+n);return d};
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function tick(){if(!soundOn)return;try{

  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+.07);

/* ================= графические помощники ================= */
function ring(p,size,sw,label,bind){
  const r=(size-sw)/2,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(100,p))/100);
  return `<span class="ringbox" style="width:${size}px;height:${size}px"><svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
   <circle class="rt" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/>
   <circle class="ra" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c}"
     transform="rotate(-90 ${size/2} ${size/2})" ${bind?`data-b="${bind}" data-c="${c}"`:`data-ro="${o}"`}/></svg><span ${bind?`data-b="${bind}t"`:''}>${label}</span></span>`;
}
function spark(vals,max,w=96,h=32){
  const n=vals.length,pts=vals.map((v,i)=>[4+i*(w-8)/(n-1),h-4-(v/max)*(h-8)]);
  const l=pts[n-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}"/><circle cx="${l[0]}" cy="${l[1]}" r="3"/></svg>`;
}
function lineChart(vals,labels){
  const w=320,h=150,pl=28,pr=10,pt=12,pb=24,min=50,max=100;
  const x=i=>pl+i*(w-pl-pr)/(vals.length-1),y=v=>pt+(1-(v-min)/(max-min))*(h-pt-pb);
  const grid=[60,70,80,90,100].map(v=>`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v)+4}">${v}</text>`).join('');
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Динамика баллов">${grid}
   <polyline class="ln" points="${pts}" data-line/>${vals.map((v,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(v)}" r="3.5"/>`).join('')}
   ${labels.map((l,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`).join('')}</svg></div>`;
}

  <div class="stats"><div><b>${avg}%</b><span>средний прогресс</span></div><div><b data-b="projAll"></b><span>задач недели закрыто</span></div><div><b>${near.due} ${plural(near.due,['день','дня','дней'])}</b><span>до ближайшего срока</span></div></div>
  <div class="list">${PROJECTS.map(p=>`<button class="proj" data-open="proj:${p.id}">${ring(p.pct,52,5,p.pct+'%')}
   <div><p class="p-name">${p.name}</p><div class="p-meta"><span>${p.area}</span><span class="${p.due<=5?'soon':''}">Срок ${inDays(p.due)}</span><span>Этап: ${p.stages[p.now][0].toLowerCase()}</span></div>
   <div class="avs">${p.team.map(k=>av(k)).join('')}</div></div></button>`).join('')}</div>`;
}
function vProject(id){
  const p=proj(id),list=TASKS.filter(t=>t.p===id),days=[...new Set(list.map(t=>t.d))];
  return `${back()}<h1>${p.name}</h1>
  <div class="hero">${ring(p.pct,92,8,p.pct+'%')}<p>${p.about}</p></div>
  <div class="facts"><div><span>Срок</span><b>${fmtDM(plusDays(p.due))}</b></div>
   ${p.budget?`<div><span>Бюджет: ${rub(p.budget[1])} из ${rub(p.budget[0])}</span><b>${Math.round(p.budget[1]/p.budget[0]*100)}% освоено</b><div class="bar"><i data-w="${p.budget[1]/p.budget[0]*100}"></i></div></div>`
   :`<div><span>Задачи недели</span><b data-b="proj:${id}"></b></div>`}</div>
  <section class="block"><h2>Этапы</h2><div class="stages">${p.stages.map((s,i)=>`<i class="${i<p.now?'done':i===p.now?'now':''}"></i>`).join('')}</div>
   <ol class="path">${p.stages.map((s,i)=>`<li class="${i<p.now?'done':i===p.now?'now':''}"><span class="pn"></span><b>${s[0]}</b><span>${i<p.now?'Закрыт '+fmtDM(plusDays(s[1])):i===p.now?'В работе':'План: '+fmtDM(plusDays(s[1]))}</span></li>`).join('')}</ol></section>
  <section class="block"><h2>Команда</h2>${p.team.map(k=>`<div class="person">${av(k,1)}<div><b>${PEOPLE[k][0]}</b><span>${PEOPLE[k][1]}</span></div></div>`).join('')}</section>
  <section class="block"><div class="row-head"><h2>Задачи этой недели</h2><span class="count" data-b="proj:${id}"></span></div>
   ${days.map(d=>`<p class="group-day">${DAYS[d]}, ${dayDate(d).getDate()}</p><div class="list">${list.filter(t=>t.d===d).map(t=>taskRow(t,'')).join('')}</div>`).join('')}</section>
  <section class="block"><h2>Заметки и решения</h2><div class="list">${p.notes.slice().reverse().map(n=>`<div class="note"><span>${fmtDM(plusDays(n[0]))}</span><p>${n[1]}</p></div>`).join('')}</div></section>`;
}

/* ---------- Цели ---------- */
function curWeek(g){return TASKS.filter(t=>t.g===g.id).filter(isDone).length}
function streak(g){let s=0;for(let i=g.hist.length-1;i>=0;i--){if(g.hist[i]>=g.plan-1)s++;else break}return s}
function vGoals(){
  return `<header class="top"><div><p class="date">Путь к большим целям</p><h1>Цели</h1></div></header>
  <div class="list">${GOALS.map(g=>{const rate=Math.round(g.hist.reduce((a,b)=>a+b,0)/(g.plan*g.hist.length)*100);
   return `<button class="goal" data-open="goal:${g.id}"><div class="g-top"><div><p class="g-name">${g.name}</p><p class="g-now">Сейчас: ${g.stages[g.now][0]}</p></div>${spark(g.hist.concat(curWeek(g)),g.plan)}</div>
   <div class="g-foot"><span>Выполнение <b>${rate}%</b></span><span>Серия <b>${streak(g)} ${plural(streak(g),['неделя','недели','недель'])}</b></span><span>Эта неделя <b data-b="goal:${g.id}"></b></span></div></button>`}).join('')}</div>`;
}
function vGoal(id){
  const g=goal(id),list=TASKS.filter(t=>t.g===id),hist=g.hist.concat(curWeek(g));
  return `${back()}<h1>${g.name}</h1><p class="sub">Шаг этой недели: ${g.step}</p>
  <section class="block" style="margin-top:24px"><h2>Последние 8 недель</h2>
   <div class="hist">${hist.map((v,i)=>{const wd=new Date(monday);wd.setDate(monday.getDate()-(7-i)*7);
     const cur=i===hist.length-1;return `<div class="h-col${cur?' cur':''}"><div class="h-plan" data-h="84"><div class="h-done" ${cur?`data-b="gh:${id}"`:`data-h="${Math.min(v,g.plan)/g.plan*100}"`}></div></div><span>${cur?'сейчас':fmtDot(wd)}</span></div>`}).join('')}</div>
   <div class="legend"><span><i style="border:1.5px dashed var(--line-strong)"></i>план: ${g.plan} в неделю</span><span><i style="background:var(--ink2)"></i>сделано</span></div></section>
  <section class="block"><h2>Этапы</h2><ol class="path">${g.stages.map((s,i)=>`<li class="${i<g.now?'done':i===g.now?'now':''}"><span class="pn"></span><b>${s[0]}</b><span>${s[1]}</span></li>`).join('')}</ol></section>
  <section class="block"><div class="row-head"><h2>Задачи шага</h2><span class="count" data-b="goal:${id}"></span></div>
   <div class="list">${list.map(t=>taskRow(t,DAYS[t.d])).join('')}</div></section>`;
}

/* ---------- Учёба ---------- */
function vStudy(){
  const nc=nextClass(),avg=Math.round(SUBJ.reduce((a,s)=>a+s.now,0)/SUBJ.length),best=Math.max(...SUBJ.map(s=>s.now));
  return `<header class="top"><div><p class="date">Магистратура «Менеджмент», вечерняя форма</p><h1>Учёба</h1></div></header>
  <div class="hero" style="margin-top:6px">${ring(SEM.week/SEM.of*100,76,7,SEM.week+'/'+SEM.of)}<div><p><b style="font-weight:600;font-size:17px;color:var(--ink)">${SEM.week}-я неделя семестра из ${SEM.of}</b></p><p class="sub" style="margin-top:2px">Средний балл ${avg} из 100. Сессия ${inDays((SEM.of-SEM.week)*7-ti)}.</p></div></div>
  ${nc?`<section class="panel" style="margin-bottom:30px"><div class="next"><div><span>Ближайшая пара</span><b>${subj(nc.s).name}</b><em>${whenLabel(nc.dd)}, ${nc.t}. ${nc.place}</em></div>
   ${nc.online?`<button class="btn" data-join>Подключиться</button>`:''}</div></section>`:''}
  <section class="block"><h2>Расписание недели</h2>${CLASSES.map(c=>`<button class="cls${c.d===ti?' today':''}" data-open="subj:${c.s}" style="width:100%"><div class="when"><b>${DS[c.d]}, ${dayDate(c.d).getDate()}</b>${c.t}–${c.e}</div><div class="what"><b>${subj(c.s).name}</b><span>${c.place}</span></div></button>`).join('')}</section>
  <section class="block"><h2>Дедлайны</h2><div class="list">${DEADLINES.map(d=>`<button class="dl" data-open="subj:${d.s}"><b>${d.title}<small>${subj(d.s).name}, готово ${d.pct}%</small></b><span class="pill${d.due<=3?' warn':''}">${inDays(d.due)}</span><div class="bar"><i data-w="${d.pct}"></i></div></button>`).join('')}</div></section>
  <section class="block"><h2>Успеваемость</h2>${SUBJ.slice().sort((a,b)=>b.now-a.now).map(s=>`<button class="score${s.now===best?' best':''}" data-open="subj:${s.id}"><b>${s.name}</b><em>${s.now}</em><div class="track"><i data-w="${s.now}"></i></div></button>`).join('')}</section>`;
}
function vSubj(id){
  const s=subj(id),cls=CLASSES.filter(c=>c.s===id),dls=DEADLINES.filter(d=>d.s===id);
  const labels=['Нед. 2','Нед. 3','Нед. 4','Нед. 5','Нед. 6'];
  return `${back()}<h1>${s.name}</h1><p class="sub">${s.teacher}</p>
  <div class="facts" style="margin-top:22px"><div><span>Текущий балл</span><b>${s.now} из 100</b></div><div><span>Занятия</span><b>${cls.map(c=>DS[c.d]+', '+c.t).join('; ')}</b></div></div>
  <section class="block"><h2>Динамика баллов</h2>${lineChart(s.scores,labels)}</section>
  <section class="block"><h2>Задания</h2><div class="list">${dls.map(d=>`<div class="dl"><b>${d.title}<small>Готово ${d.pct}%</small></b><span class="pill${d.due<=3?' warn':''}">${inDays(d.due)}</span><div class="bar"><i data-w="${d.pct}"></i></div></div>`).join('')}</div></section>
  <section class="block"><h2>Где проходит</h2>${cls.map(c=>`<div class="cls"><div class="when"><b>${DS[c.d]}, ${c.t}</b></div><div class="what"><b>${c.place}</b><span>${c.online?'Ссылка появится за 15 минут до начала':'Корпус на Проспекте Мира'}</span></div></div>`).join('')}</section>`;
}

/* ---------- Финансы ---------- */
function vMoney(){
  const inc=OPS.filter(o=>o[4]).reduce((a,o)=>a+o[1],0),exp=OPS.filter(o=>!o[4]).reduce((a,o)=>a+o[1],0);
  MONTHS[2][2]=exp;
  const mx=Math.max(...MONTHS.map(m=>Math.max(m[1],m[2])));
  const prevExp=MONTHS[1][2];
  const bud=budgetRows();
  const ops=OPS.slice().sort((a,b)=>b[3]-a[3]);
  const dl=n=>n===0?'Сегодня':n===-1?'Вчера':fmtShort(plusDays(n));
  return `<header class="top"><div><p class="date">Свободно в ${MONTH_IN[mIdx]}</p><p class="money-big">${rub(inc-exp)}</p>
   <p class="delta">Доходы <b>${rub(inc)}</b>, расходы ${rub(exp)}. За прошлый месяц потрачено ${rub(prevExp)}</p></div></header>
  <section class="block"><h2>Три месяца</h2><div class="months">${MONTHS.map((m,i)=>`<div class="mo${i===2?' cur':''}"><div class="mo-bars"><i class="in" data-h="${m[1]/mx*100}"></i><i class="out" data-h="${m[2]/mx*100}"></i></div><span>${MON[m[0]]}${i===2?', по сегодня':''}</span></div>`).join('')}</div>
   <div class="legend"><span><i style="background:var(--accent)"></i>доходы</span><span><i style="background:var(--ink2);opacity:.75"></i>расходы</span></div></section>
  <section class="block"><h2>Копилки</h2><div class="jars">${JARS.map(j=>`<div class="panel jar">${ring(j[1]/j[2]*100,60,6,Math.round(j[1]/j[2]*100)+'%')}<div><b>${j[0]}</b><em>${rub(j[1])}</em><span>из ${rub(j[2])}</span></div></div>`).join('')}</div></section>
  <section class="block"><h2>Бюджет месяца</h2>${bud.map(([n,s,l])=>{const p=s/l*100,full=p>100;return `<div class="budget"><b>${n}</b><em class="${full?'full':''}">${rub(s)} из ${rub(l)}</em><div class="track"><i class="${full?'full':''}" data-w="${Math.min(p,100)}"></i></div></div>`}).join('')}</section>
  <section class="block"><h2>Операции</h2><div class="list">${ops.map(o=>`<div class="op"><div><b>${o[0]}</b><span>${dl(o[3])}, ${o[2].toLowerCase()}</span></div><span class="sum${o[4]?' in':''}">${o[4]?'+':'−'}${rub(o[1])}</span></div>`).join('')}</div></section>`;
}
const ROOT={today:vToday,projects:vProjects,goals:vGoals,study:vStudy,money:vMoney};

/* ================= привязки: обновляются при каждой отметке ================= */
function bindAll(){
  document.querySelectorAll('[data-b]').forEach(el=>{
    const [k,a]=el.dataset.b.split(':');let c;
    switch(k){
      case 'today':c=cnt(TASKS.filter(t=>t.d===ti));el.textContent=c[0]+' из '+c[1];break;
      case 'ring':c=cnt(TASKS.filter(t=>t.d===ti));el.style.strokeDashoffset=el.dataset.c*(1-c[0]/c[1]);break;
      case 'ringt':c=cnt(TASKS.filter(t=>t.d===ti));el.textContent=Math.round(c[0]/c[1]*100)+'%';break;
      case 'brief':el.innerHTML=briefHTML();break;
      case 'weekTotal':c=cnt(TASKS);el.textContent=c[0]+' из '+c[1]+' задач';break;
      case 'wk':c=cnt(TASKS.filter(t=>t.d===+a));el.style.height=(c[0]/c[1]*100)+'%';break;
      case 'wkn':c=cnt(TASKS.filter(t=>t.d===+a));el.textContent=c[0]?c[0]+'/'+c[1]:'';break;
      case 'day':c=cnt(TASKS.filter(t=>t.d===+a));el.textContent=c[0]+' из '+c[1];break;
      case 'goal':c=cnt(TASKS.filter(t=>t.g===a));el.textContent=c[0]+' из '+goal(a).plan;break;
      case 'gh':el.style.height=(Math.min(curWeek(goal(a)),goal(a).plan)/goal(a).plan*100)+'%';break;
      case 'proj':c=cnt(TASKS.filter(t=>t.p===a));el.textContent=c[0]+' из '+c[1];break;
      case 'projAll':c=cnt(TASKS.filter(t=>t.p));el.textContent=c[0]+'/'+c[1];break;
    }
  });
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');
    document.querySelectorAll('[data-h]').forEach(el=>el.style.height=el.dataset.h+'%');
    document.querySelectorAll('[data-ro]').forEach(el=>el.style.strokeDashoffset=el.dataset.ro);
    document.querySelectorAll('[data-line]').forEach(el=>el.style.strokeDashoffset=0);
  });
}

/* ================= навигация ================= */
const stage=document.getElementById('stage');
let stack=[],curTab='today',busy=false;
function mk(html,cls){const s=document.createElement('section');s.className='screen '+cls;s.innerHTML=html;stage.appendChild(s);return s}
function showTab(tab){
  if(busy)return;curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  const old=stack;stack=[];
  const s=mk(ROOT[tab](),'fade-start');stack.push(s);
  s.getBoundingClientRect();
  requestAnimationFrame(()=>{s.classList.remove('fade-start');bindAll()});
  old.forEach(o=>{o.classList.add('fade-out');setTimeout(()=>o.remove(),220)});
}
function push(spec){
  if(busy)return;busy=true;
  const [k,a]=spec.split(':');
  const html=k==='day'?vDay(+a):k==='proj'?vProject(a):k==='goal'?vGoal(a):vSubj(a);
  const prev=stack[stack.length-1];
  const s=mk(html,'pushed off-right');stack.push(s);
  s.getBoundingClientRect();
  requestAnimationFrame(()=>{s.classList.remove('off-right');prev.classList.add('behind');bindAll()});
  setTimeout(()=>busy=false,440);
}
function pop(){
  if(stack.length<2||busy)return;busy=true;
  const s=stack.pop(),prev=stack[stack.length-1];
  s.classList.remove('dragging');prev.classList.remove('dragging');
  s.style.transform='';prev.style.transform='';prev.style.opacity='';
  s.classList.add('off-right');prev.classList.remove('behind');
  setTimeout(()=>{s.remove();busy=false},440);
}

/* свайп назад от левого края */
let sx=null,sy=0,dx=0,drag=false;
stage.addEventListener('touchstart',e=>{if(stack.length<2||busy)return;const t=e.touches[0];if(t.clientX-stage.getBoundingClientRect().left>28)return;sx=t.clientX;sy=t.clientY;dx=0;drag=false},{passive:true});
stage.addEventListener('touchmove',e=>{if(sx===null)return;const t=e.touches[0];dx=Math.max(0,t.clientX-sx);
  if(!drag&&Math.abs(t.clientY-sy)>dx+4){sx=null;return}
  drag=true;const s=stack[stack.length-1],p=stack[stack.length-2],w=stage.clientWidth;
  s.classList.add('dragging');p.classList.add('dragging');
  s.style.transform=`translateX(${dx}px)`;p.style.transform=`translateX(${-24+dx/w*24}%)`;p.style.opacity=.5+dx/w*.5},{passive:true});
stage.addEventListener('touchend',()=>{if(sx===null)return;sx=null;if(!drag)return;
  const s=stack[stack.length-1],p=stack[stack.length-2];
  if(dx>stage.clientWidth*.3){pop()}else{s.classList.remove('dragging');p.classList.remove('dragging');s.style.transform='';p.style.transform='';p.style.opacity=''}});

/* ================= клики ================= */
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-task],[data-open],[data-back],[data-tab],[data-sound],[data-reset],[data-join]');if(!el)return;
  if(el.dataset.task){e.stopPropagation();const t=byId(el.dataset.task),v=!isDone(t);over[t.id]=v;save();if(v)tick();
    document.querySelectorAll(`[data-task="${t.id}"]`).forEach(r=>{r.classList.toggle('done',v);r.setAttribute('aria-pressed',v)});bindAll()}
  else if(el.hasAttribute('data-join'))toast('В демо-версии ссылка на пару отключена');
  else if(el.dataset.open)push(el.dataset.open);
  else if(el.hasAttribute('data-back'))pop();
  else if(el.dataset.tab){if(el.dataset.tab===curTab&&stack.length<2)return;showTab(el.dataset.tab)}
  else if(el.hasAttribute('data-sound')){soundOn=!soundOn;try{localStorage.setItem('os-demo-sound',soundOn?'1':'0')}catch(e){}el.innerHTML=soundOn?SND_ON:SND_OFF;if(soundOn)tick()}
  else if(el.hasAttribute('data-reset')){over={};save();document.querySelectorAll('[data-task]').forEach(r=>{const d=isDone(byId(r.dataset.task));r.classList.toggle('done',d);r.setAttribute('aria-pressed',d)});bindAll();toast('Отметки сброшены')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pop()});

showTab('today');
})();
</script>
</body>
</html>
